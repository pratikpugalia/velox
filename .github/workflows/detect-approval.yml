# Step 1 of the auto-trigger-full-build-on-approval chain.
#
# Fires on every pull_request_review:[submitted] event. For fork PRs,
# this event runs in fork-PR context — secrets are NOT available — so
# this workflow can only do non-privileged work. It records the PR meta
# (number, head/base SHA + ref, owner) into an artifact when the review
# is an approval; the chained trigger-full-on-approval.yml
# (workflow_run-triggered, BASE context) downloads the artifact and
# invokes linux-build.yml via workflow_call to run the full build.
#
# Why this split: GitHub blocks secrets and write tokens for any event
# triggered from a fork PR (pull_request_review included). The only way
# to land write-capable context (needed for workflow_call to a workflow
# whose check_runs must land on the PR head SHA) is to chain through
# workflow_run, which always runs in BASE context.

name: Detect Approval

# zizmor:disable:dangerous-triggers -- pull_request_review fires in
# privileged context, but no PR-controlled code is executed and the
# only secret-touching action runs in the chained workflow.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  detect:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Record approval meta
        env:
          # Bind via the template engine, reference via shell expansion.
          # Avoids template-injection: PR-controlled fields (head_ref,
          # base_ref, pr_owner) are passed as JSON-string args to jq,
          # never interpolated into the shell command itself.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          mkdir -p /tmp/meta
          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_ref "$HEAD_REF" \
            --arg base_ref "$BASE_REF" \
            --arg base_sha "$BASE_SHA" \
            --arg pr_owner "$PR_OWNER" \
            '{pr_number: $pr, head_sha: $head_sha, head_ref: $head_ref, base_ref: $base_ref, base_sha: $base_sha, pr_owner: $pr_owner}' \
            > /tmp/meta/approval.json

      - name: Upload approval meta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approval-meta
          path: /tmp/meta/approval.json
          retention-days: 1
          if-no-files-found: error
