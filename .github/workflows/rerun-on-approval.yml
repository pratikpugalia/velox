# Step 2 of the auto-trigger-full-build-on-approval chain.
#
# Triggered via workflow_run when detect-approval.yml completes (on a
# pull_request_review:[submitted] event). workflow_run always runs in
# BASE context with full GITHUB_TOKEN write access — even for fork
# PRs. That's the whole point of the chain.
#
# Trust model:
#   detect-approval.yml runs in fork-PR context (the YAML is loaded
#   from the PR head ref), so anything it writes is attacker-
#   controllable. We trust ONLY `github.event.workflow_run.id`, which
#   GitHub sets when the upstream run is created and forks cannot
#   influence. From that id we API-derive the upstream's actual
#   head_sha and resolve the PR — the fork can't substitute another
#   PR's identity.
#
# Behaviour:
#   * Resolve the upstream PR head SHA + number from workflow_run.id.
#   * Dedup: only fire on the FIRST approving review for this head
#     SHA.
#   * Find the most recent `Linux Build using GCC` run on the PR head
#     SHA.
#   * If the run is still in progress, cancel it and wait for it to
#     terminate; then re-run it.
#
# Why re-run instead of dispatching a fresh build:
#   GitHub Actions ties each job's check_run to `github.sha` of the
#   triggering event. A re-run preserves the original `pull_request`
#   event's SHA, so check_runs land on the PR head SHA and reviewers
#   see the full build status on the PR. workflow_call from this
#   workflow_run-triggered context would land check_runs on the
#   default branch's HEAD instead.
#
# When the re-run executes, `selective-build-plan.yml`'s standing-
# approval check sees the new approval and resolves to full mode
# automatically — no escalation flag or input plumbing needed.

name: Rerun Linux Build on Approval

on:
  workflow_run:
    workflows: [Detect Approval]
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  actions: write # required by /actions/runs/{id}/{cancel,rerun}

jobs:
  decide:
    # Filter on conclusion to avoid running for skipped detect-approval
    # invocations (non-approving reviews skip the detect job → workflow
    # conclusion = success-with-skipped or skipped depending on GitHub
    # internals; either way the artifact won't exist and the download
    # step exits early).
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Re-derive the upstream PR head SHA and number from
      # `workflow_run.id` (GitHub-set, not forgeable), instead of
      # trusting any artifact written by detect-approval.yml in fork-PR
      # context. Two GitHub quirks handled here:
      #
      #   1. `github.event.workflow_run.head_sha` is the SHA of THIS
      #      workflow's definition on main, NOT the upstream run's head
      #      SHA. We have to look up the upstream run via
      #      /actions/runs/{id} to get the real head_sha.
      #
      #   2. `/repos/{repo}/commits/{sha}/pulls` returns empty for fork-
      #      PR head SHAs in this repo. The /search/issues API works.
      - name: Resolve upstream PR head from workflow_run
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          upstream=$(gh api "/repos/$REPO/actions/runs/$UPSTREAM_RUN_ID")
          upstream_event=$(echo "$upstream" | jq -r '.event')
          if [ "$upstream_event" != "pull_request_review" ]; then
            echo "upstream event was $upstream_event — exiting"
            exit 0
          fi
          head_sha=$(echo "$upstream" | jq -r '.head_sha')

          pr_number=$(gh api "/search/issues?q=is:pr+repo:$REPO+sha:$head_sha" \
            --jq '[.items[] | select(.state == "open")][0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "no open PR for $head_sha — exiting"
            exit 0
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha"   >> "$GITHUB_OUTPUT"

      # Dedup: only fire on the FIRST approving review for this head SHA.
      # Subsequent approvals (other reviewers, or re-approvals after
      # dismissal) skip — the prior build re-run is still valid for the
      # same SHA, no need to re-run again.
      - name: Dedup against prior approvals on this SHA
        if: steps.meta.outputs.pr_number
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr_number }}
          SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          # Count approving reviews on this exact head SHA. The just-
          # submitted review (the one that triggered detect-approval) is
          # already included by the time we query, so == 1 means we are
          # the first; > 1 means an earlier approval already triggered
          # the re-run on this same SHA.
          approvals=$(gh api "/repos/$REPO/pulls/$PR/reviews" \
            --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$SHA\")] | length")
          echo "approvals on this SHA: $approvals"
          if [ "$approvals" -eq 1 ]; then
            echo "should_rerun=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_rerun=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find latest Linux Build run on PR head
        if: steps.dedup.outputs.should_rerun == 'true'
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          # Find the workflow id by name (file path also works but name
          # is what the API surfaces consistently across renames).
          wf_id=$(gh api "/repos/$REPO/actions/workflows" \
            --jq '.workflows[] | select(.name == "Linux Build using GCC") | .id')
          if [ -z "$wf_id" ]; then
            echo "::error::could not resolve workflow id for 'Linux Build using GCC'"
            exit 1
          fi
          # Most recent run on this PR head SHA.
          run_json=$(gh api "/repos/$REPO/actions/workflows/$wf_id/runs?head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0] // empty')
          if [ -z "$run_json" ]; then
            echo "no Linux Build run found for $SHA — nothing to re-run"
            exit 0
          fi
          run_id=$(echo "$run_json" | jq -r '.id')
          run_status=$(echo "$run_json" | jq -r '.status')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_status=$run_status" >> "$GITHUB_OUTPUT"
          echo "Found run $run_id (status=$run_status)"

      - name: Cancel in-flight run if needed
        if: steps.find_run.outputs.run_id && steps.find_run.outputs.run_status != 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.find_run.outputs.run_id }}
        run: |
          # Cancel is async; rerun won't accept a non-completed run.
          # Issue cancel, then poll until the run reaches a terminal
          # status. Cap the wait at ~5 minutes so a stuck run doesn't
          # block the chain forever.
          gh api -X POST "/repos/$REPO/actions/runs/$RUN_ID/cancel" || true
          for _ in $(seq 1 30); do
            status=$(gh api "/repos/$REPO/actions/runs/$RUN_ID" --jq '.status')
            echo "  poll: status=$status"
            if [ "$status" = "completed" ]; then break; fi
            sleep 10
          done

      - name: Rerun
        if: steps.find_run.outputs.run_id
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.find_run.outputs.run_id }}
        run: |
          gh api -X POST "/repos/$REPO/actions/runs/$RUN_ID/rerun"
          echo "Re-ran $RUN_ID; check_runs will appear under the original PR head SHA."
