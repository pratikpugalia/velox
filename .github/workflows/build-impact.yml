name: Build Impact Analysis

on:
  pull_request:
    paths:
      - velox/**
      - CMakeLists.txt
      - CMake/**

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  build-impact:
    name: Analyze Build Impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get changed files
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base_commit=$(gh api -q '.merge_base_commit.sha' \
            /repos/facebookincubator/velox/compare/facebookincubator:$BASE_REF...$PR_OWNER:$HEAD_REF \
          )
          {
            echo 'files<<EOF'
            git diff --name-only "$merge_base_commit..$HEAD_SHA"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Detect affected targets
        env:
          CHANGED_FILES_LIST: ${{ steps.changes.outputs.files }}
          COMMENT_OUTPUT: /tmp/build-impact-comment.md
        run: python3 .github/scripts/detect-affected-modules.py

      - name: Post or update PR comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/build-impact-comment.md', 'utf8');
            const marker = '<!-- build-impact-analysis -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
