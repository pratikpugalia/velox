# Step 2 of the auto-trigger-full-build-on-approval chain.
#
# Triggered via workflow_run when detect-approval.yml completes (on a
# pull_request_review:[submitted] event). workflow_run always runs in
# BASE context with full GITHUB_TOKEN write access AND repo secrets
# available — even for fork PRs. That's the whole point of the chain.
#
# Behaviour:
#   * Download the approval-meta artifact uploaded by detect-approval.
#   * Query the PR's reviews API: if this is the FIRST approving review
#     for the current head SHA, dispatch linux-build.yml in full mode
#     via workflow_call. If a prior approval already exists for this
#     SHA, do nothing (dedup).
#   * The called linux-build.yml's check_runs land on the PR head SHA
#     (workflow_call inherits caller run context, which here is the
#     workflow_run.head_sha = the PR head SHA), so the build is visible
#     on the PR and respected by branch protection.
#
# Security note: workflow_call to linux-build.yml deliberately does NOT
# pass `secrets: inherit`. The build runs PR-controlled code (CMake,
# setup scripts) and must not have repo secrets in scope. linux-build.yml
# also pins its own permissions: block to read-only.

name: Trigger Full Build on Approval

# zizmor:disable:dangerous-triggers -- workflow_run is privileged but
# we only download an artifact (PR meta JSON) uploaded by our own
# detect-approval workflow and feed it into a workflow_call invocation
# of linux-build.yml. No PR-controlled code is executed in this
# workflow's context.

on:
  workflow_run:
    workflows: [Detect Approval]
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  decide:
    # Filter on conclusion to avoid running for skipped detect-approval
    # invocations (non-approving reviews skip the detect job → workflow
    # conclusion = success-with-skipped or skipped depending on GitHub
    # internals; either way the artifact won't exist and the download
    # step exits early).
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_trigger: ${{ steps.dedup.outputs.should_trigger }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      head_ref: ${{ steps.meta.outputs.head_ref }}
      base_ref: ${{ steps.meta.outputs.base_ref }}
      base_sha: ${{ steps.meta.outputs.base_sha }}
      pr_owner: ${{ steps.meta.outputs.pr_owner }}
    steps:
      # The artifact is missing for non-approving reviews (detect job
      # was skipped via `if:`) — continue-on-error lets us bail out
      # cleanly without failing the workflow.
      - name: Download approval meta
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: approval-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read PR meta
        if: steps.download.outcome == 'success'
        id: meta
        run: |
          # Bail cleanly if the artifact is malformed (missing fields).
          for field in pr_number head_sha head_ref base_ref base_sha pr_owner; do
            value=$(jq -r --arg k "$field" '.[$k] // empty' approval.json)
            if [ -z "$value" ]; then
              echo "approval.json missing field $field"
              exit 0
            fi
            echo "$field=$value" >> "$GITHUB_OUTPUT"
          done

      # Dedup: only fire on the FIRST approving review for this head SHA.
      # Subsequent approvals (other reviewers, or re-approvals after
      # dismissal) skip — the prior build run is still valid for the
      # same SHA, no need to re-run.
      - name: Dedup against prior approvals on this SHA
        if: steps.meta.outputs.pr_number
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr_number }}
          SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          # Count approving reviews on this exact head SHA. The just-
          # submitted review (the one that triggered detect-approval) is
          # already included by the time we query, so == 1 means we are
          # the first; > 1 means an earlier approval already triggered
          # the full build on this same SHA.
          approvals=$(gh api "/repos/$REPO/pulls/$PR/reviews" \
            --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$SHA\")] | length")
          echo "approvals on this SHA: $approvals"
          if [ "$approvals" -eq 1 ]; then
            echo "should_trigger=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
          fi

  trigger-build:
    needs: decide
    if: needs.decide.outputs.should_trigger == 'true'
    # NOTE: deliberately no `secrets: inherit`. linux-build.yml's build
    # jobs run PR-controlled code (CMake, setup scripts) and must not
    # have repo secrets in scope. The called workflow's permissions
    # block additionally pins GITHUB_TOKEN to read-only.
    uses: ./.github/workflows/linux-build.yml
    with:
      force_full: true
      pr_number: ${{ needs.decide.outputs.pr_number }}
      head_sha: ${{ needs.decide.outputs.head_sha }}
      head_ref: ${{ needs.decide.outputs.head_ref }}
      base_ref: ${{ needs.decide.outputs.base_ref }}
      base_sha: ${{ needs.decide.outputs.base_sha }}
      pr_owner: ${{ needs.decide.outputs.pr_owner }}
