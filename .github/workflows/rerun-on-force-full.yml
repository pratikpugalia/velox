# Step 2 of the auto-trigger-full-build chain.
#
# Triggered via workflow_run when detect-force-full.yml completes
# (on either an approving review or the `ci-full-build` label being
# applied). workflow_run always runs in BASE context with full
# GITHUB_TOKEN write access — even for fork PRs. That's the whole
# point of the chain.
#
# Trust model:
#   detect-force-full.yml runs in fork-PR context (the YAML is loaded
#   from the PR head ref), so anything it writes is attacker-
#   controllable. We trust ONLY `github.event.workflow_run.id`, which
#   GitHub sets when the upstream run is created and forks cannot
#   influence. From that id we API-derive the upstream's actual
#   head_sha and resolve the PR — the fork can't substitute another
#   PR's identity.
#
# Behaviour:
#   * Resolve the upstream PR head SHA + number from workflow_run.id.
#   * Dedup by upstream event:
#       - approval: only fire on the FIRST approving review for this
#         head SHA (subsequent approvals on the same SHA are no-ops).
#       - /full-build comment: only fire on the FIRST maintainer
#         /full-build comment on the PR (subsequent /full-build
#         comments are no-ops; the in-flight build is already going
#         to escalate via the first one).
#   * Find the most recent `Linux Build using GCC` run on the PR head
#     SHA.
#   * If the run is still in progress, cancel it and wait for it to
#     terminate; then re-run it.
#
# Why re-run instead of dispatching a fresh build:
#   GitHub Actions ties each job's check_run to `github.sha` of the
#   triggering event. A re-run preserves the original `pull_request`
#   event's SHA, so check_runs land on the PR head SHA and reviewers
#   see the full build status on the PR. workflow_call from this
#   workflow_run-triggered context would land check_runs on the
#   default branch's HEAD instead.
#
# When the re-run executes, `selective-build-plan.yml` re-checks both
# the standing approval and any maintainer /full-build comment on the
# PR, OR-combines them into is_force_full, and resolves to full mode
# automatically — no escalation flag or input plumbing needed.

name: Rerun Linux Build on Force-Full Trigger

on:
  workflow_run:
    workflows: [Detect Force-Full Trigger]
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  actions: write # required by /actions/runs/{id}/{cancel,rerun}

jobs:
  decide:
    # Filter on conclusion to skip detect invocations whose `if:` was
    # false (non-approving review, non-matching label). The detect job
    # is skipped → workflow conclusion = success-with-skipped or
    # skipped depending on GitHub internals; the meta step exits
    # early either way once it sees the upstream event doesn't match.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # workflow_run-triggered jobs start with an empty workspace; check
      # out just the helper-scripts dir so the sourced gh-api-retry.sh
      # is on disk for every step that uses it. Sparse-checkout keeps
      # this fast (no full clone) and the BASE-context default ref
      # ensures we trust the helper from main rather than the PR head.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Re-derive the upstream PR head SHA and number from
      # `workflow_run.id` (GitHub-set, not forgeable), instead of
      # trusting any artifact written by detect-force-full.yml in
      # fork-PR context. Two GitHub quirks handled here:
      #
      #   1. `github.event.workflow_run.head_sha` is the SHA of THIS
      #      workflow's definition on main, NOT the upstream run's head
      #      SHA. We have to look up the upstream run via
      #      /actions/runs/{id} to get the real head_sha.
      #
      #   2. `/repos/{repo}/commits/{sha}/pulls` returns empty for fork-
      #      PR head SHAs in this repo. The /search/issues API works.
      - name: Resolve upstream PR head from workflow_run
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          source .github/scripts/gh-api-retry.sh
          upstream=$(gh_api "/repos/$REPO/actions/runs/$UPSTREAM_RUN_ID")
          upstream_event=$(echo "$upstream" | jq -r '.event')
          if [ "$upstream_event" != "pull_request_review" ] \
             && [ "$upstream_event" != "issue_comment" ]; then
            echo "upstream event was $upstream_event — exiting"
            exit 0
          fi

          # For pull_request_review the head_sha is the PR head. For
          # issue_comment, head_sha is the default branch HEAD (the
          # event isn't tied to a SHA), so we resolve the PR head via
          # the API instead. Either path needs pr_number first.
          if [ "$upstream_event" = "pull_request_review" ]; then
            head_sha=$(echo "$upstream" | jq -r '.head_sha')
            pr_number=$(gh_api "/search/issues?q=is:pr+repo:$REPO+sha:$head_sha" \
              --jq '[.items[] | select(.state == "open")][0].number // empty')
          else
            # The upstream issue_comment event has the PR number in its
            # payload, surfaced via .pull_requests on the run object.
            pr_number=$(echo "$upstream" | jq -r '.pull_requests[0].number // empty')
            if [ -z "$pr_number" ]; then
              # Fall back to display_title parsing if the run object
              # didn't surface .pull_requests (rare for issue_comment).
              echo "no PR number on upstream run — exiting"
              exit 0
            fi
            head_sha=$(gh_api "/repos/$REPO/pulls/$pr_number" --jq '.head.sha')
          fi

          if [ -z "$pr_number" ] || [ -z "$head_sha" ]; then
            echo "could not resolve PR or head SHA — exiting"
            exit 0
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha"   >> "$GITHUB_OUTPUT"
          echo "upstream_event=$upstream_event" >> "$GITHUB_OUTPUT"

      # Dedup logic differs by upstream event:
      #   approval — count approving reviews on this exact head SHA;
      #     == 1 means we are the first; > 1 means an earlier approval
      #     already triggered the re-run on this same SHA.
      #   /full-build comment — count /full-build comments on the PR;
      #     == 1 means we are the first; > 1 means an earlier
      #     /full-build already triggered the re-run.
      - name: Dedup
        if: steps.meta.outputs.pr_number
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr_number }}
          SHA: ${{ steps.meta.outputs.head_sha }}
          UPSTREAM_EVENT: ${{ steps.meta.outputs.upstream_event }}
        run: |
          source .github/scripts/gh-api-retry.sh
          if [ "$UPSTREAM_EVENT" = "pull_request_review" ]; then
            approvals=$(gh_api "/repos/$REPO/pulls/$PR/reviews" \
              --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$SHA\")] | length")
            echo "approvals on this SHA: $approvals"
            count=$approvals
          else
            count=$(gh_api --paginate "/repos/$REPO/issues/$PR/comments" \
              --jq '[.[] | select(.body | test("^/full-build(\\s|$)"; "m"))] | length')
            echo "/full-build comments on this PR: $count"
          fi
          if [ "$count" -eq 1 ]; then
            echo "should_rerun=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_rerun=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find latest Linux Build run on PR head
        if: steps.dedup.outputs.should_rerun == 'true'
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          source .github/scripts/gh-api-retry.sh
          # Find the workflow id by name (file path also works but name
          # is what the API surfaces consistently across renames).
          wf_id=$(gh_api "/repos/$REPO/actions/workflows" \
            --jq '.workflows[] | select(.name == "Linux Build using GCC") | .id')
          if [ -z "$wf_id" ]; then
            echo "::error::could not resolve workflow id for 'Linux Build using GCC'"
            exit 1
          fi
          # Most recent run on this PR head SHA.
          run_json=$(gh_api "/repos/$REPO/actions/workflows/$wf_id/runs?head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0] // empty')
          if [ -z "$run_json" ]; then
            echo "no Linux Build run found for $SHA — nothing to re-run"
            exit 0
          fi
          run_id=$(echo "$run_json" | jq -r '.id')
          run_status=$(echo "$run_json" | jq -r '.status')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_status=$run_status" >> "$GITHUB_OUTPUT"
          echo "Found run $run_id (status=$run_status)"

      - name: Cancel in-flight run if needed
        if: steps.find_run.outputs.run_id && steps.find_run.outputs.run_status != 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.find_run.outputs.run_id }}
        run: |
          source .github/scripts/gh-api-retry.sh
          # Force-cancel skips graceful runner shutdown — terminates
          # immediately, instead of waiting for in-flight cmake/link
          # steps that can ignore SIGTERM until they finish. The
          # ~5-min wait the regular cancel needed shrinks to seconds.
          if ! gh run cancel --force --repo "$REPO" "$RUN_ID" 2>/tmp/cancel_err; then
            # Only swallow the expected race-with-completion case
            # (run finished between find_run and cancel). Anything
            # else — perms, network, 5xx — surfaces as a real error
            # instead of silently absorbing into a polling-loop
            # timeout that then fails the next step opaquely.
            status=$(gh_api "/repos/$REPO/actions/runs/$RUN_ID" --jq '.status')
            if [ "$status" != "completed" ]; then
              echo "::error::force-cancel failed and run is still $status"
              cat /tmp/cancel_err
              exit 1
            fi
            echo "force-cancel raced with run completion; harmless"
          fi
          # Brief poll to wait for the status field to flip to
          # 'completed' so the rerun step doesn't 422.
          for _ in $(seq 1 12); do
            status=$(gh_api "/repos/$REPO/actions/runs/$RUN_ID" --jq '.status')
            echo "  poll: status=$status"
            if [ "$status" = "completed" ]; then break; fi
            sleep 5
          done

      - name: Rerun
        if: steps.find_run.outputs.run_id
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.find_run.outputs.run_id }}
        run: |
          source .github/scripts/gh-api-retry.sh
          gh_api -X POST "/repos/$REPO/actions/runs/$RUN_ID/rerun"
          echo "Re-ran $RUN_ID; check_runs will appear under the original PR head SHA."
